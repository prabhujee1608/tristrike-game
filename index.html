
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriStrike</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');

        :root {
            --ink: #17212b;
            --muted: #66717c;
            --paper: #fffdf8;
            --line: #e8e1d5;
            --coral: #f06f61;
            --teal: #207f78;
            --gold: #f4bd55;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px 16px;
            color: var(--ink);
            background: #f4eee3;
            font-family: 'DM Sans', sans-serif;
        }

        main {
            width: min(100%, 680px);
            overflow: hidden;
            border: 1px solid rgba(23, 33, 43, .08);
            border-radius: 24px;
            background: var(--paper);
            box-shadow: 0 24px 70px rgba(76, 59, 35, .15);
        }

        header {
            padding: 38px 32px 32px;
            color: white;
            background: var(--teal);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #b9e1d6;
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        h1, h2 { font-family: 'Space Grotesk', sans-serif; }
        h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.3rem); line-height: 1; }
        header p:last-child { margin: 14px 0 0; color: #d9f0e9; }

        .game { padding: 28px 32px 32px; }
        .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin-bottom: 30px; }
        .score { padding: 16px; border: 1px solid var(--line); border-radius: 14px; text-align: center; background: #fff; }
        .score span { display: block; color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        .score strong { display: block; margin-top: 3px; font-family: 'Space Grotesk', sans-serif; font-size: 2.2rem; }
        .versus { color: var(--coral); font-family: 'Space Grotesk', sans-serif; font-size: .8rem; font-weight: 700; }
        .prompt { margin: 0 0 14px; font-weight: 700; }
        .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .choice { min-height: 112px; padding: 16px 8px; border: 1px solid var(--line); border-radius: 15px; color: var(--ink); background: #fff; cursor: pointer; font: inherit; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
        .choice:hover, .choice:focus-visible { border-color: var(--coral); box-shadow: 0 8px 20px rgba(240, 111, 97, .16); transform: translateY(-3px); outline: none; }
        .choice:active { transform: translateY(0); }
        .choice .icon { display: block; margin-bottom: 8px; font-size: 2.2rem; }
        .choice small { display: block; margin-top: 4px; color: var(--muted); font-size: .75rem; }

        .result { min-height: 155px; margin-top: 26px; padding: 22px; border-radius: 16px; text-align: center; background: #f8f3ea; }
        .result h2 { margin: 0 0 10px; font-size: 1.5rem; }
        .result p { margin: 6px 0; color: var(--muted); }
        #outcome.win { color: var(--teal); }
        #outcome.lose { color: var(--coral); }
        #outcome.draw { color: #a16a18; }
        #reset { margin-top: 22px; padding: 10px 18px; border: 0; border-radius: 999px; color: var(--ink); background: var(--gold); cursor: pointer; font: inherit; font-weight: 700; }
        #reset:hover, #reset:focus-visible { background: #f7c96e; outline: 3px solid rgba(244, 189, 85, .35); }

        @media (max-width: 520px) {
            header, .game { padding-left: 20px; padding-right: 20px; }
            .scoreboard { gap: 8px; }
            .score { padding: 12px 8px; }
            .choices { gap: 8px; }
            .choice { min-height: 100px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">A quick hand game</p>
            <h1>TriStrike</h1>
            <p>Snake, water, or gun. Choose your move.</p>
        </header>
        <section class="game" aria-label="Game board">
            <div class="scoreboard" aria-live="polite">
                <div class="score"><span>You</span><strong id="user-score">0</strong></div>
                <div class="versus">VS</div>
                <div class="score"><span>Computer</span><strong id="computer-score">0</strong></div>
            </div>
            <p class="prompt">Make your choice</p>
            <div class="choices">
                <button class="choice" data-choice="s"><span class="icon">🐍</span>Snake<small>beats Water</small></button>
                <button class="choice" data-choice="w"><span class="icon">💧</span>Water<small>beats Gun</small></button>
                <button class="choice" data-choice="g"><span class="icon">🔫</span>Gun<small>beats Snake</small></button>
            </div>
            <div class="result" aria-live="polite">
                <h2 id="outcome">Choose a move to begin</h2>
                <p id="round-details">The first player to take the lead wins the bragging rights.</p>
                <button id="reset" type="button">Reset score</button>
            </div>
        </section>
    </main>
    <script>
        const choices = {
            s: { name: 'Snake', icon: '🐍' },
            w: { name: 'Water', icon: '💧' },
            g: { name: 'Gun', icon: '🔫' }
        };
        const beats = { s: 'w', w: 'g', g: 's' };
        let userScore = 0;
        let computerScore = 0;

        function playGame(userChoice) {
            const keys = Object.keys(choices);
            const computerChoice = keys[Math.floor(Math.random() * keys.length)];
            const outcome = document.getElementById('outcome');
            const details = document.getElementById('round-details');

            outcome.className = '';
            if (userChoice === computerChoice) {
                outcome.textContent = 'It\'s a draw!';
                outcome.classList.add('draw');
            } else if (beats[userChoice] === computerChoice) {
                userScore++;
                outcome.textContent = 'You win this round!';
                outcome.classList.add('win');
            } else {
                computerScore++;
                outcome.textContent = 'Computer wins this round.';
                outcome.classList.add('lose');
            }

            details.textContent = `${choices[userChoice].icon} ${choices[userChoice].name} vs ${choices[computerChoice].icon} ${choices[computerChoice].name}`;
            document.getElementById('user-score').textContent = userScore;
            document.getElementById('computer-score').textContent = computerScore;
        }

        document.querySelectorAll('.choice').forEach((button) => {
            button.addEventListener('click', () => playGame(button.dataset.choice));
        });

        document.getElementById('reset').addEventListener('click', () => {
            userScore = 0;
            computerScore = 0;
            document.getElementById('user-score').textContent = '0';
            document.getElementById('computer-score').textContent = '0';
            document.getElementById('outcome').textContent = 'Choose a move to begin';
            document.getElementById('outcome').className = '';
            document.getElementById('round-details').textContent = 'The first player to take the lead wins the bragging rights.';
        });
    </script>
</body>
</html>
